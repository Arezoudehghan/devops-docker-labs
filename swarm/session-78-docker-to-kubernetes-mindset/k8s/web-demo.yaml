apiVersion: v1
kind: Namespace
metadata:
  name: devops-lab

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: devops-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  minReadySeconds: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: web-demo

  template:
    metadata:
      labels:
        app: web-demo

    spec:
      terminationGracePeriodSeconds: 10

      containers:
        - name: web
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: APP_VERSION
              value: "v1"

          command:
            - /bin/sh
            - -c

          args:
            - |
              printf 'VERSION=%s POD=%s\n' "$APP_VERSION" "$HOSTNAME" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: devops-lab
spec:
  type: NodePort

  selector:
    app: web-demo

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
