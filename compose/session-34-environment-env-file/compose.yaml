name: compose-env-lab

services:

  app:

    image: python:3.12-alpine

    working_dir: /app

    command:
      - python
      - app.py

    volumes:
      - ./app.py:/app/app.py:ro

    env_file:
      - ./env/common.env
      - ./env/${APP_ENV:?APP_ENV must be set}.env

    environment:
      APP_NAME: "${APP_NAME:-compose-env-lab}"
      APP_PORT: "8000"

    ports:
      - "${HOST_PORT:-18080}:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"

      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped
