name: Validate DevOps Docker Labs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare safe environment files
        run: |
          cp compose/session-34-environment-env-file/.env.example compose/session-34-environment-env-file/.env
          cp compose/session-36-networks/.env.example compose/session-36-networks/.env
          cp compose/session-37-depends-on-restart/.env.example compose/session-37-depends-on-restart/.env

      - name: Validate Session 34 Compose configuration
        run: docker compose --env-file compose/session-34-environment-env-file/.env -f compose/session-34-environment-env-file/compose.yaml config --quiet

      - name: Validate Session 34 Python syntax
        run: python3 -m py_compile compose/session-34-environment-env-file/app.py

      - name: Pull Session 34 image
        run: docker compose --env-file compose/session-34-environment-env-file/.env -f compose/session-34-environment-env-file/compose.yaml pull

      - name: Validate Session 36 Compose configuration
        run: docker compose --env-file compose/session-36-networks/.env -f compose/session-36-networks/compose.yaml config --quiet

      - name: Build Session 36 images
        run: docker compose --env-file compose/session-36-networks/.env -f compose/session-36-networks/compose.yaml build --pull

      - name: Validate Session 37 Compose configuration
        run: docker compose --env-file compose/session-37-depends-on-restart/.env -f compose/session-37-depends-on-restart/compose.yaml config --quiet

      - name: Pull Session 37 images
        run: docker compose --env-file compose/session-37-depends-on-restart/.env -f compose/session-37-depends-on-restart/compose.yaml pull

      - name: Validate Session 63 Compose configuration
        run: docker compose -f monitoring/session-63-node-exporter-docker-host/compose.yaml config --quiet

      - name: Validate shell scripts
        run: |
          bash -n compose/session-36-networks/scripts/verify.sh
          bash -n compose/session-37-depends-on-restart/scripts/verify.sh
          bash -n production/session-71-zero-downtime-deploy/scripts/switch.sh

      - name: Build Session 71 Blue image
        run: docker build -t zero-app:v1 production/session-71-zero-downtime-deploy/releases/v1

      - name: Build Session 71 Green image
        run: docker build -t zero-app:v2 production/session-71-zero-downtime-deploy/releases/v2

      - name: Validate Session 75 Python syntax
        run: python3 -m py_compile swarm/session-75-swarm-rolling-update/app.py

      - name: Validate Session 75 Swarm stack
        run: docker stack config -c swarm/session-75-swarm-rolling-update/stack.yml > /dev/null

      - name: Build Session 75 image
        run: docker build -t swarm-rolling-demo:ci swarm/session-75-swarm-rolling-update

      - name: Validate Session 76 Compose configuration
        run: docker compose -f swarm/session-76-compose-vs-swarm/compose/compose.yaml config --quiet

      - name: Validate Session 76 Swarm stack
        run: docker stack config -c swarm/session-76-compose-vs-swarm/swarm/stack.yaml > /dev/null
